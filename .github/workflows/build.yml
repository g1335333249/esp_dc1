name: Build Firmware

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio

      - name: Install PlatformIO
        run: |
          pip install platformio

      - name: Build
        run: pio run -e dc1

      - name: Prepare firmware
        run: |
          mkdir -p release
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
            cp output/dc1.bin "release/esp-dc1-${VERSION}.bin"
          else
            cp output/dc1.bin "release/esp-dc1-latest.bin"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp-dc1-firmware
          path: release/*.bin
          compression-level: 0

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Latest Release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: "Latest Build"
          body: "Automatic build from the latest commit on ${{ github.ref_name }}"
          artifacts: "release/esp-dc1-latest.bin"
          allowUpdates: true
          replacesArtifacts: true
          prerelease: true
          token: ${{ secrets.GITHUB_TOKEN }}
